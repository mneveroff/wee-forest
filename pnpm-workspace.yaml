packages:
  - "lens"
  - "site"

overrides:
  sqlite3: ^6.0.1

minimumReleaseAge: 10080

minimumReleaseAgeExclude:
  - astro
  - "@astrojs/*"
  - "@tailwindcss/*"
  - "@oxlint/*"
  - "@playwright/*"
  - "@vitest/*"
  - oxlint
  - playwright
  - playwright-core
  - tailwindcss
  - typescript
  - vite
  - vitest

allowBuilds:
  core-js: false
  esbuild: true
  protobufjs: false
  sharp: true
  sqlite3: true
