packages:
  - "lens"
  - "site"

overrides:
  sqlite3: ^6.0.1

minimumReleaseAge: 10080

minimumReleaseAgeExclude:
  - astro
  - "@astrojs/*"
  - "@tailwindcss/*"
  - "@oxlint/*"
  - "@playwright/*"
  - "@types/react"
  - "@types/react-dom"
  - "@vitest/*"
  - oxlint
  - playwright
  - playwright-core
  - react
  - react-dom
  - react-map-gl
  - tailwindcss
  - typescript
  - vite
  - vitest
  - zustand

allowBuilds:
  core-js: false
  esbuild: true
  protobufjs: false
  sharp: true
  sqlite3: true
